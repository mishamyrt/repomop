name: Update Homebrew Tap

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft && !github.event.release.prerelease }}
    steps:
      - name: Compute SHA256
        id: sha
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          ARM_URL="${BASE}/repomop_darwin_arm64.tar.gz"
          AMD_URL="${BASE}/repomop_darwin_amd64.tar.gz"
          ARM_SHA=$(curl -fsSL "$ARM_URL" | shasum -a 256 | awk '{print $1}')
          AMD_SHA=$(curl -fsSL "$AMD_URL" | shasum -a 256 | awk '{print $1}')
          echo "arm_sha256=$ARM_SHA" >> "$GITHUB_OUTPUT"
          echo "arm_url=$ARM_URL" >> "$GITHUB_OUTPUT"
          echo "amd_sha256=$AMD_SHA" >> "$GITHUB_OUTPUT"
          echo "amd_url=$AMD_URL" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: mishamyrt/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update formula
        env:
          TAG: ${{ github.event.release.tag_name }}
          ARM_SHA256: ${{ steps.sha.outputs.arm_sha256 }}
          ARM_URL: ${{ steps.sha.outputs.arm_url }}
          AMD_SHA256: ${{ steps.sha.outputs.amd_sha256 }}
          AMD_URL: ${{ steps.sha.outputs.amd_url }}
        run: |
          VERSION="${TAG#v}"
          cat > Formula/repomop.rb << 'FORMULA'
          class Repomop < Formula
            desc "Project artifacts cleaner"
            homepage "https://github.com/mishamyrt/repomop"
            license "MIT"
            version "VERSION_PLACEHOLDER"

            depends_on :macos

            if Hardware::CPU.arm?
              url "ARM_URL_PLACEHOLDER"
              sha256 "ARM_SHA256_PLACEHOLDER"
            else
              url "AMD_URL_PLACEHOLDER"
              sha256 "AMD_SHA256_PLACEHOLDER"
            end

            def install
              bin.install "repomop"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/repomop --version")
            end
          end
          FORMULA
          sed -i 's/^          //' Formula/repomop.rb
          sed -i "s|VERSION_PLACEHOLDER|${VERSION}|" Formula/repomop.rb
          sed -i "s|ARM_URL_PLACEHOLDER|${ARM_URL}|" Formula/repomop.rb
          sed -i "s|ARM_SHA256_PLACEHOLDER|${ARM_SHA256}|" Formula/repomop.rb
          sed -i "s|AMD_URL_PLACEHOLDER|${AMD_URL}|" Formula/repomop.rb
          sed -i "s|AMD_SHA256_PLACEHOLDER|${AMD_SHA256}|" Formula/repomop.rb

      - name: Commit and push
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/repomop.rb
          git commit -m "chore: update repomop to ${TAG}"
          git push
