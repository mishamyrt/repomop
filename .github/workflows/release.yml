name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build release asset (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - os: darwin
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - os: linux
            arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Build archive
        env:
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "dist/repomop_${OS}_${ARCH}"
          cargo build --release --locked --package repomop --target "${TARGET}"
          cp "target/${TARGET}/release/repomop" "dist/repomop_${OS}_${ARCH}/repomop"
          tar -C "dist/repomop_${OS}_${ARCH}" -czf "dist/repomop_${OS}_${ARCH}.tar.gz" repomop

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release_${{ matrix.os }}_${{ matrix.arch }}
          path: dist/repomop_${{ matrix.os }}_${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-release-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release_*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum repomop_*.tar.gz > checksums.txt

      - name: Extract release notes from changelog
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release notes for ${APP_VERSION} were not found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            dist/repomop_*.tar.gz
            dist/checksums.txt
