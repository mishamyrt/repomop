name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build release asset (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview

      - name: Build archive
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          APP_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "dist/repomop_${GOOS}_${GOARCH}"
          go build -trimpath -ldflags \
            "-s -w -X 'main.appVersion=${APP_VERSION}'" \
            -o "dist/repomop_${GOOS}_${GOARCH}/repomop" ./cmd/repomop
          tar -C "dist/repomop_${GOOS}_${GOARCH}" -czf "dist/repomop_${GOOS}_${GOARCH}.tar.gz" repomop

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: release_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/repomop_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-release-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: release_*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum repomop_*.tar.gz > checksums.txt

      - name: Extract release notes from changelog
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${APP_VERSION#v}"
          awk -v version="${VERSION}" '
            $0 ~ "^## \\[" version "\\]" { in_section=1; next }
            in_section && $0 ~ "^## \\[" { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Release notes for ${APP_VERSION} were not found in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          overwrite_files: true
          files: |
            dist/repomop_*.tar.gz
            dist/checksums.txt
